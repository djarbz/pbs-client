name: Publish Docker Image

on:
  schedule:
    # Runs at 00:00 UTC every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "scripts/**"
      - ".github/workflows/container-publish.yaml"

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'dev/') ||
      startsWith(github.ref,'refs/tags/v')

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }},enable=${{ github.ref_type == 'tag' || github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'dev') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Get Latest ARM64 PBS Client URL
        id: pbs-arm64
        run: |
          # Fetch the latest release JSON, find the asset specifically named "proxmox-backup-client_..." and extract its download URL
          URL=$(curl -s https://api.github.com/repos/wofferl/proxmox-backup-arm64/releases/latest | jq -r '.assets[] | select(.name | startswith("proxmox-backup-client_") and endswith(".deb")) | .browser_download_url' | head -n 1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ARM64_URL=${{ steps.pbs-arm64.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
