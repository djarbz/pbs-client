name: Create Release Tag
run-name: Bumping ${{ inputs.bump_type }} release tag by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Select the version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump_version:
    name: Bump ${{ inputs.bump_type }} version
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: gha-actions/bump-tag@0.4.0
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WITH_V: true
          # Dynamically use the workflow input (major, minor, or patch)
          DEFAULT_BUMP: ${{ inputs.bump_type }}

      - name: Trigger container build
        if: ${{ steps.tag.outputs.new_tag }}
        run: gh workflow run container-publish.yaml --ref ${{ steps.tag.outputs.new_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
